# Override de GELIA-NV Test. No usa gelianv-prod:latest.
# GELIANV_TEST_IMAGE debe ser gelianv-test:8.4.27-24.22.1-<sha12>.
services:
  app:
    image: ${GELIANV_TEST_IMAGE:?Definir GELIANV_TEST_IMAGE}
    pull_policy: never
  queue:
    image: ${GELIANV_TEST_IMAGE:?Definir GELIANV_TEST_IMAGE}
    pull_policy: never
  reverb:
    image: ${GELIANV_TEST_IMAGE:?Definir GELIANV_TEST_IMAGE}
    pull_policy: never
  scheduler:
    image: ${GELIANV_TEST_IMAGE:?Definir GELIANV_TEST_IMAGE}
    pull_policy: never
  web:
    volumes: !override
      - .:/var/www/html
      - ./default.test.conf:/etc/nginx/conf.d/default.conf
      - storage_data:/var/www/html/storage
